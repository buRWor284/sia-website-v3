# SignalIQ — Coverage Refresher
# Triggers the BigQuery day-scanner (src/app/api/signaliq/refresh-coverage).
# Each run scans at most one MISSING day of GDELT Web News NGrams — one query
# covers every topic at once — and derives the 60-day coverage cache from it
# (see the route's header comment for the rules).
#
# Scheduled at :07 and :37 — NOT :00/:30. GitHub heavily delays or skips
# scheduled workflows queued at round minutes (peak load); offset minutes fire
# far more reliably. Even so, expect throttling: ~15-30 actual runs/day, not 48.
# Most of those are cheap no-ops; only a missing day costs a BigQuery scan.
#
# WHAT COUNTS AS A FAILURE (rewritten 2026-07-25):
#   - non-200, or an unreachable endpoint  -> job FAILS (real fault).
#   - quotaBlocked=true                    -> job passes with a ::warning::.
#     BigQuery's custom QueryUsagePerDay cap resets at midnight PACIFIC, so a
#     backfill can exhaust the day's budget and every scan after it is rejected
#     until that rollover. The day is never logged, so it retries by itself.
#     This used to surface as hours of red runs that looked like a dead pipeline.
#   - daysBehind >= 3                      -> job passes with a ::warning::.
#     The route only scans within a 7-day catch-up window; a day that falls out
#     of that window is lost silently, so this is the signal that matters.
#
# The previous version parsed .ok/.failed/.throttled — GDELT DOC-API fields that
# the BigQuery route never returns — so OK was always 0 and EVERY successful run
# emitted a bogus "fetched 0 topics" warning. Keep this block in sync with the
# route's JSON response shape.
#
# Required GitHub secret: CRON_SECRET (same value as the Vercel env var)
# Add it at: Settings -> Secrets and variables -> Actions -> New repository secret

name: SignalIQ Coverage Refresh

on:
  schedule:
    - cron: '7,37 * * * *'    # twice hourly, offset from peak :00/:30 slots
  workflow_dispatch:           # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger coverage refresh
        run: |
          RESPONSE=$(curl -s --max-time 90 -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.syedirfanajmal.com/api/signaliq/refresh-coverage)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Response status: ${STATUS:-<none>}"
          echo "Response body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status ${STATUS:-<none>}" && exit 1
          fi

          QUOTA=$(echo "$BODY"   | jq -r '.quotaBlocked // false' 2>/dev/null || echo false)
          BEHIND=$(echo "$BODY"  | jq -r '.daysBehind // 0'       2>/dev/null || echo 0)
          SCANNED=$(echo "$BODY" | jq -r '.scanned | length'      2>/dev/null || echo 0)
          DERIVED=$(echo "$BODY" | jq -r '.derive.topicsDerived // "skipped"' 2>/dev/null || echo skipped)
          DAY=$(echo "$BODY"     | jq -r '.scanned[0].day // "-"' 2>/dev/null || echo -)
          MB=$(echo "$BODY"      | jq -r '.scanned[0].bytesBilledMB // 0' 2>/dev/null || echo 0)
          echo "Scanned: $SCANNED day(s) [$DAY, ${MB} MB] | derived: $DERIVED topics | days behind: $BEHIND"

          if [ "$QUOTA" = "true" ]; then
            MSG=$(echo "$BODY" | jq -r '.message // "no message"' 2>/dev/null || echo "no message")
            echo "::warning::BigQuery daily budget exhausted — no scan this run. Retries automatically after the midnight-Pacific quota reset. ($MSG)"
            exit 0
          fi

          case "$BEHIND" in
            ''|*[!0-9]*) ;;
            *) if [ "$BEHIND" -ge 3 ]; then
                 echo "::warning::Coverage is $BEHIND days behind. The catch-up window is 7 days — anything older is dropped silently. Check the BigQuery quota and the Actions schedule."
               fi ;;
          esac
