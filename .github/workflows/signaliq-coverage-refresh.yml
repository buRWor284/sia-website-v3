# SignalIQ — Coverage Refresher
# Triggers the background GDELT poller every 30 minutes.
# Each run fetches coverage for the next 10 seeds (rotating cursor) and saves
# to Supabase. 12 runs cover all 120 seeds in ~6 hours, then repeats.
#
# Required GitHub secret: CRON_SECRET (same value as the Vercel env var)
# Add it at: Settings → Secrets and variables → Actions → New repository secret

name: SignalIQ Coverage Refresh

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger coverage refresh
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.syedirfanajmal.com/api/signaliq/refresh-coverage)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Response status: $STATUS"
          echo "Response body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status $STATUS" && exit 1
          fi
