# SignalIQ — Coverage Refresher
# Triggers the background GDELT poller (src/app/api/signaliq/refresh-coverage).
# Each run works a rotating cursor over the 120 preset seeds with a ~40s time
# budget and per-seed retries (see the route's header comment for the rules).
#
# Scheduled at :07 and :37 — NOT :00/:30. GitHub heavily delays or skips
# scheduled workflows queued at round minutes (peak load); offset minutes fire
# far more reliably. Even so, expect throttling: ~15-30 actual runs/day, not 48.
#
# The step emits a ::warning:: annotation when a run fetched 0 topics, so a
# "green but useless" run is visible from the Actions list without opening logs.
#
# Required GitHub secret: CRON_SECRET (same value as the Vercel env var)
# Add it at: Settings → Secrets and variables → Actions → New repository secret

name: SignalIQ Coverage Refresh

on:
  schedule:
    - cron: '7,37 * * * *'    # twice hourly, offset from peak :00/:30 slots
  workflow_dispatch:           # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger coverage refresh
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.syedirfanajmal.com/api/signaliq/refresh-coverage)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Response status: $STATUS"
          echo "Response body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status $STATUS" && exit 1
          fi
          OK=$(echo "$BODY" | jq -r '.ok // 0' 2>/dev/null || echo 0)
          FAILED=$(echo "$BODY" | jq -r '.failed // 0' 2>/dev/null || echo 0)
          THROTTLED=$(echo "$BODY" | jq -r '.throttled // 0' 2>/dev/null || echo 0)
          echo "Fetched OK: $OK | failed: $FAILED | throttled: $THROTTLED"
          if [ "$OK" = "0" ]; then
            echo "::warning::Coverage refresh run fetched 0 topics (failed=$FAILED, throttled=$THROTTLED) — GDELT likely rejecting Vercel egress this run"
          fi
